{{- if not .Values.secrets.existingSecret }}
{{- $name := include "ch.secretName" . }}
{{- $existing := (lookup "v1" "Secret" .Release.Namespace $name).data | default dict }}
{{- $jwt := .Values.secrets.jwtSecret }}
{{- if not $jwt }}
{{- $jwt = (get $existing "JWT_SECRET" | b64dec) | default (randAlphaNum 48) }}
{{- end }}
{{- $dbUrl := .Values.externalDatabase.url }}
{{- $pgPassword := "" }}
{{- if .Values.postgresql.enabled }}
{{- $pgPassword = .Values.postgresql.auth.password }}
{{- if not $pgPassword }}
{{- $pgPassword = (get $existing "POSTGRES_PASSWORD" | b64dec) | default (randAlphaNum 32) }}
{{- end }}
{{- $dbUrl = printf "postgresql+psycopg://%s:%s@%s:5432/%s" .Values.postgresql.auth.username $pgPassword (include "ch.postgresql.fullname" .) .Values.postgresql.auth.database }}
{{- end }}
{{- if not $dbUrl }}
{{- fail "Set externalDatabase.url, enable postgresql, or provide secrets.existingSecret" }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "ch.labels" . | nindent 4 }}
type: Opaque
data:
  JWT_SECRET: {{ $jwt | b64enc | quote }}
  DATABASE_URL: {{ $dbUrl | b64enc | quote }}
  {{- if .Values.postgresql.enabled }}
  POSTGRES_PASSWORD: {{ $pgPassword | b64enc | quote }}
  {{- end }}
{{- end }}
